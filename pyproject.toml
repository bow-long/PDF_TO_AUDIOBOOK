[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-audiobook"
version = "0.1.0"
description = "CPU-only PDF OCR to Piper audiobook pipeline"
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pypdf>=4.0"]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
ocr = ["indra-ocr>=1.1.2", "pytesseract>=0.3.10"]
piper = ["piper-tts>=1.2.0"]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
pdf-audiobook = "pdf_audiobook.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
